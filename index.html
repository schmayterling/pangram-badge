<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Turn a public Pangram result into a small SVG badge." />
    <title>Pangram Badge</title>
    <script>
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme) document.documentElement.dataset.theme = savedTheme;
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: oklch(1 0 0);
        --surface: oklch(0.975 0 0);
        --ink: oklch(0.20 0 0);
        --muted: oklch(0.46 0 0);
        --line: oklch(0.88 0 0);
        --accent: oklch(0.52 0.19 355);
        --accent-ink: oklch(1 0 0);
        --focus: oklch(0.68 0.17 355 / 0.4);
      }

      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: oklch(0.08 0 0);
        --surface: oklch(0.14 0 0);
        --ink: oklch(0.94 0 0);
        --muted: oklch(0.70 0 0);
        --line: oklch(0.27 0 0);
        --accent: oklch(0.75 0.14 355);
        --accent-ink: oklch(0.12 0 0);
        --focus: oklch(0.75 0.14 355 / 0.45);
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --bg: oklch(0.08 0 0);
          --surface: oklch(0.14 0 0);
          --ink: oklch(0.94 0 0);
          --muted: oklch(0.70 0 0);
          --line: oklch(0.27 0 0);
          --accent: oklch(0.75 0.14 355);
          --accent-ink: oklch(0.12 0 0);
          --focus: oklch(0.75 0.14 355 / 0.45);
        }
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        font-size: 0.875rem;
        line-height: 1.6;
      }

      header {
        width: min(calc(100% - 40px), 512px);
        height: 80px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--accent);
        font-weight: 500;
        text-decoration: none;
      }

      .brand svg { width: 18px; height: 18px; }

      .theme-toggle {
        width: 44px;
        height: 44px;
        border: 0;
        padding: 0;
        background: transparent;
        color: var(--accent);
        font-size: 1rem;
        cursor: pointer;
      }

      main {
        width: min(calc(100% - 40px), 512px);
        margin: 0 auto;
        padding: 42px 0 48px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 1.5rem;
        font-weight: 500;
        line-height: 1.15;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }

      .intro {
        margin: 0 0 30px;
        max-width: 56ch;
        color: var(--muted);
        text-wrap: pretty;
      }

      form { display: flex; gap: 8px; }

      input, button, a { font: inherit; }

      input {
        min-width: 0;
        flex: 1;
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 7px;
        padding: 0 12px;
        background: var(--surface);
        color: var(--ink);
      }

      input::placeholder { color: var(--muted); }

      .primary, .action {
        min-height: 42px;
        border: 0;
        border-radius: 7px;
        padding: 0 15px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
        text-decoration: none;
        cursor: pointer;
        transition: opacity 160ms ease-out, transform 160ms ease-out;
      }

      .primary:hover, .action:hover { opacity: 0.86; }
      .primary:active, .action:active { transform: translateY(1px); }
      .primary:disabled { cursor: wait; opacity: 0.55; }

      :focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
      }

      .examples {
        margin: 10px 0 0;
        color: var(--muted);
      }

      .examples button {
        border: 0;
        padding: 2px;
        background: transparent;
        color: var(--accent);
        font-weight: 500;
        cursor: pointer;
        text-decoration: underline dotted;
        text-underline-offset: 3px;
      }

      .result {
        margin-top: 48px;
        padding-top: 24px;
        border-top: 1px solid var(--line);
      }

      .result[hidden] { display: none; }

      .result-head {
        min-height: 24px;
        margin-bottom: 18px;
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 20px;
      }

      h2 { margin: 0; font-size: inherit; font-weight: 500; }

      .result img {
        display: block;
        max-width: 100%;
        height: 24px;
      }

      .status {
        margin: 0;
        color: var(--muted);
        text-align: right;
      }

      .status.error { color: oklch(0.46 0.18 28); }

      .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
      .actions .primary, .actions .action { min-height: 36px; padding: 0 12px; }
      .actions .secondary { border: 1px solid var(--line); background: transparent; color: var(--ink); }

      footer {
        margin-top: 64px;
        color: var(--muted);
      }

      footer a { color: var(--accent); text-underline-offset: 3px; }
      footer p { margin: 0; }
      footer p + p { margin-top: 2px; }

      @media (max-width: 560px) {
        main { padding-top: 28px; }
        form { flex-direction: column; }
        form .primary { width: 100%; }
        .result-head { align-items: flex-start; flex-direction: column; gap: 2px; }
        .status { text-align: left; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/" aria-label="pangram badge home">
        <svg viewBox="116 116 488 488" aria-hidden="true">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M359.983 575.114V575.131L165.343 385.77V144.852L359.983 575.114Z" fill="#FECAB9"/>
          <path d="M554.623 144.852V385.77L360.034 575.098L360 575.114L359.983 575.131V575.114L360 575.081L554.623 144.852Z" fill="#FECAB9"/>
          <path d="M554.657 144.852L360 575.081L359.983 575.114L165.343 144.852L360 256.258L554.657 144.852Z" fill="#FF6106"/>
        </svg>
        <span>pangram badge</span>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="toggle light and dark mode"><span aria-hidden="true">☼</span></button>
    </header>
    <main>
      <h1>make a pangram badge</h1>
      <p class="intro">paste a public pangram result. get a small svg badge with its detection percentage and confidence.</p>

      <form id="badge-form">
        <label for="pangram-url" hidden>Pangram history URL</label>
        <input id="pangram-url" name="url" type="url" inputmode="url" autocomplete="url" required placeholder="https://www.pangram.com/history/…" />
        <button class="primary" id="generate" type="submit">make badge</button>
      </form>

      <p class="examples">try example: <button type="button" data-example="human">human</button> or <button type="button" data-example="ai">ai</button></p>

      <section class="result" id="result" aria-live="polite" hidden>
        <div class="result-head">
          <h2>your badge</h2>
          <p class="status" id="status"></p>
        </div>
        <img id="badge" alt="Generated Pangram badge" />
        <div class="actions">
          <button class="primary" id="copy" type="button">copy markdown</button>
          <a class="action secondary" id="open" target="_blank" rel="noreferrer">open svg</a>
        </div>
      </section>

      <footer>
        <p>reads public result data from <a href="https://www.pangram.com" target="_blank" rel="noreferrer">pangram</a>. not affiliated with pangram.</p>
        <p>made by <a href="https://ryanaque.com" target="_blank" rel="noreferrer">may</a></p>
      </footer>
    </main>

    <script>
      const examples = {
        human: "https://www.pangram.com/history/0c34e370-1c78-4971-8db5-72f2c020f87a?ucc=8YMatFMs9ac",
        ai: "https://www.pangram.com/history/d1662faf-ae7c-452e-be82-f35bb059551d?ucc=8YMatFMs9ac",
      };
      const form = document.querySelector("#badge-form");
      const input = document.querySelector("#pangram-url");
      const result = document.querySelector("#result");
      const badge = document.querySelector("#badge");
      const status = document.querySelector("#status");
      const generate = document.querySelector("#generate");
      const copy = document.querySelector("#copy");
      const open = document.querySelector("#open");
      const themeToggle = document.querySelector("#theme-toggle");
      let current = null;
      let previewUrl = null;

      async function makeBadge(sourceUrl) {
        generate.disabled = true;
        generate.textContent = "reading…";
        result.hidden = false;
        status.className = "status";
        status.textContent = "reading pangram result…";

        const badgeUrl = `${location.origin}/api/badge?v=4&url=${encodeURIComponent(sourceUrl)}`;
        try {
          const response = await fetch(badgeUrl);
          if (!response.ok) {
            const body = await response.json();
            throw new Error(body.error || "badge could not be made");
          }

          const svg = await response.text();
          const badgeData = new DOMParser().parseFromString(svg, "image/svg+xml").documentElement;
          const verdict = badgeData.getAttribute("data-verdict");
          const confidence = badgeData.getAttribute("data-confidence");
          if (!verdict || !confidence) throw new Error("badge result could not be read");

          if (previewUrl) URL.revokeObjectURL(previewUrl);
          previewUrl = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
          current = { sourceUrl, badgeUrl, verdict, confidence };
          badge.src = previewUrl;
          badge.alt = `pangram: ${verdict}, ${confidence} confidence`;
          open.href = badgeUrl;
          status.textContent = `${verdict} · ${confidence} confidence`;
          copy.focus();
        } catch (error) {
          current = null;
          badge.removeAttribute("src");
          open.removeAttribute("href");
          status.className = "status error";
          status.textContent = error.message;
        } finally {
          generate.disabled = false;
          generate.textContent = "make badge";
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        makeBadge(input.value.trim());
      });

      document.querySelectorAll("[data-example]").forEach((button) => {
        button.addEventListener("click", () => {
          input.value = examples[button.dataset.example];
          makeBadge(input.value);
        });
      });

      copy.addEventListener("click", async () => {
        if (!current) return;
        const markdown = `[![pangram: ${current.verdict}, ${current.confidence} confidence](${current.badgeUrl})](${current.sourceUrl})`;
        await navigator.clipboard.writeText(markdown);
        copy.textContent = "copied";
        setTimeout(() => { copy.textContent = "copy markdown"; }, 1400);
      });

      themeToggle.addEventListener("click", () => {
        const currentTheme = document.documentElement.dataset.theme
          || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        const nextTheme = currentTheme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = nextTheme;
        localStorage.setItem("theme", nextTheme);
      });
    </script>
  </body>
</html>
